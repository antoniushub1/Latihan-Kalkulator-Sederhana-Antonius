<!DOCTYPE html>
<html>
    <head>
        <title>Kalkulator</title>
    </head>

    <body>
        <script>
                const angka1 = Number(prompt("Masukkan angka pertama:"));
                const operasi= prompt("+, -, *, /");
                const angka2 = Number(prompt("Masukkan angka kedua:"));
                let hasil;
                if (operasi == "+") {
                    hasil = angka1 + angka2;
                }
                else if (operasi == "-") {
                    hasil = angka1 - angka2;
                }
                else if (operasi == "*") {
                    hasil = angka1 * angka2;
                }
                else if (operasi == "/") {
                    hasil = angka1 / angka2;
                }
                else {
                    alert("Operasi tidak valid!");
                }
                alert("Hasil: " + hasil);           
        </script>
    </body>
</html>
